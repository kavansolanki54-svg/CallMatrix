name: call_alyze_mobile
description: "Callalyze Mobile Telemetry & Call Log Sync App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.5.0+1
  flutter_riverpod: ^2.5.1
  flutter_secure_storage: ^9.2.2
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  connectivity_plus: ^6.0.3
  workmanager: ^0.10.5
  flutter_background_service: ^5.0.5
  sqflite: ^2.3.3
  path_provider: ^2.1.3
  intl: ^0.19.0
  logger: ^2.3.0
  uuid: ^4.4.0
  google_generative_ai: ^0.4.3
  flutter_dotenv: ^5.1.0
  flutter_contacts: ^1.1.9+2
  audioplayers: ^6.0.0
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  flutter_animate: ^4.5.0
  share_plus: ^9.0.0
  url_launcher: ^6.3.0
  cached_network_image: ^3.3.1
  google_fonts: ^8.2.0
  shared_preferences: ^2.2.3
  file_picker: ^8.0.7
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/logo_icon.png
